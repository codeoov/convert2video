[package]
name = "c2v-desktop"
version = "0.0.1"
description = "C2V Desktop Mic Recorder"
authors = ["convert2video"]
edition = "2021"
rust-version = "1.77"

[[bin]]
name = "c2v-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
cpal = "0.15"
hound = "3.5"
mdns-sd = "=0.11.5"
reqwest = { version = "0.12", default-features = true, features = ["blocking", "multipart", "json"] }
keyring = "3"
hostname = "0.4"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
