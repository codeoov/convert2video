name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Same-ref push and workflow_dispatch share this group, so a newer run can cancel the other.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  policy-checks:
    # GitHub-hosted ubuntu-24.04 includes pwsh; policy scripts are PowerShell.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CLAUDE_PROJECT_DIR: ${{ github.workspace }}
    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: check-forbidden-imports
        id: check_forbidden_imports
        if: always() && steps.checkout.outcome == 'success'
        shell: pwsh -NoProfile -File "{0}"
        run: |
          & "$env:CLAUDE_PROJECT_DIR/scripts/check-forbidden-imports.ps1"

      - name: check-terminology-forbidden
        id: check_terminology_forbidden
        if: always() && steps.checkout.outcome == 'success'
        shell: pwsh -NoProfile -File "{0}"
        run: |
          & "$env:CLAUDE_PROJECT_DIR/scripts/check-terminology-forbidden.ps1"

      - name: check-logging-forbidden
        id: check_logging_forbidden
        if: always() && steps.checkout.outcome == 'success'
        shell: pwsh -NoProfile -File "{0}"
        run: |
          & "$env:CLAUDE_PROJECT_DIR/scripts/check-logging-forbidden.ps1"

      - name: check-callbackflow-close-handlers
        id: check_callbackflow_close_handlers
        if: always() && steps.checkout.outcome == 'success'
        shell: pwsh -NoProfile -File "{0}"
        run: |
          & "$env:CLAUDE_PROJECT_DIR/scripts/check-callbackflow-close-handlers.ps1" -RepoRoot $env:CLAUDE_PROJECT_DIR -SourceRoot "$env:CLAUDE_PROJECT_DIR/app/src"

      - name: Aggregate policy-check results
        if: always() && steps.checkout.outcome == 'success'
        shell: pwsh -NoProfile -File "{0}"
        run: |
          $forbidden = '${{ steps.check_forbidden_imports.outcome }}'
          $terminology = '${{ steps.check_terminology_forbidden.outcome }}'
          $logging = '${{ steps.check_logging_forbidden.outcome }}'
          $callbackflow = '${{ steps.check_callbackflow_close_handlers.outcome }}'
          Write-Host "check-forbidden-imports: $forbidden"
          Write-Host "check-terminology-forbidden: $terminology"
          Write-Host "check-logging-forbidden: $logging"
          Write-Host "check-callbackflow-close-handlers: $callbackflow"
          $outcomes = @($forbidden, $terminology, $logging, $callbackflow)
          if ($outcomes | Where-Object { $_ -ne 'success' }) {
            Write-Host "One or more policy-check steps were not success."
            exit 1
          }

  build-and-test:
    needs: policy-checks
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
      actions: write
    env:
      GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up JDK 17
        id: setup_java
        # https://github.com/actions/setup-java/commit/c5195efecf7bdfc987ee8bae7a71cb8b11521c00
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        id: setup_android
        # https://github.com/android-actions/setup-android/commit/9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
        with:
          packages: tools platform-tools

      - name: Ensure Android platform 36 and build-tools
        id: ensure_android_packages
        run: |
          set -euo pipefail
          if [ -z "${ANDROID_SDK_ROOT:-}" ] && [ -n "${ANDROID_HOME:-}" ]; then
            ANDROID_SDK_ROOT="$ANDROID_HOME"
          fi
          : "${ANDROID_SDK_ROOT:?ANDROID_SDK_ROOT/ANDROID_HOME not set}"
          : "${ANDROID_HOME:=$ANDROID_SDK_ROOT}"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          if [ ! -d "$ANDROID_SDK_ROOT" ] || [ ! -w "$ANDROID_SDK_ROOT" ]; then
            echo "ANDROID_SDK_ROOT is missing or not writable: $ANDROID_SDK_ROOT" >&2
            exit 1
          fi

          SDKMANAGER=""
          if [ -x "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          else
            for candidate in "$ANDROID_SDK_ROOT"/cmdline-tools/*/bin/sdkmanager; do
              if [ -x "$candidate" ]; then
                SDKMANAGER="$candidate"
                break
              fi
            done
          fi
          if [ -z "$SDKMANAGER" ] && [ -x "$ANDROID_SDK_ROOT/tools/bin/sdkmanager" ]; then
            SDKMANAGER="$ANDROID_SDK_ROOT/tools/bin/sdkmanager"
          fi
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager not found under ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >&2
            exit 1
          fi

          if [ ! -d "$ANDROID_SDK_ROOT/platforms/android-36" ]; then
            echo "Installing platforms;android-36"
            "$SDKMANAGER" --sdk_root="$ANDROID_SDK_ROOT" "platforms;android-36"
          else
            echo "platforms;android-36 already present"
          fi
          if [ ! -d "$ANDROID_SDK_ROOT/build-tools/35.0.0" ]; then
            echo "Installing build-tools;35.0.0"
            "$SDKMANAGER" --sdk_root="$ANDROID_SDK_ROOT" "build-tools;35.0.0"
          else
            echo "build-tools;35.0.0 already present"
          fi

      - name: Set up Gradle
        id: setup_gradle
        # https://github.com/gradle/actions/commit/06832c7b30a0129d7fb559bcc6e43d26f6374244
        uses: gradle/actions/setup-gradle@06832c7b30a0129d7fb559bcc6e43d26f6374244 # v4.3.1

      - name: Make gradlew executable
        id: chmod_gradlew
        run: chmod +x gradlew

      - name: Verify BACKEND_BASE_URL helper contract (self-test)
        id: verify_backend_base_url
        run: ./gradlew :app:verifyBackendBaseUrlContract --stacktrace

      - name: Compile debug Kotlin
        id: compile_debug_kotlin
        run: ./gradlew :app:compileDebugKotlin --stacktrace

      - name: Unit tests (google + huawei debug)
        id: unit_tests
        run: ./gradlew :app:testGoogleDebugUnitTest :app:testHuaweiDebugUnitTest --stacktrace

      - name: List unit test outputs
        id: list_unit_test_outputs
        if: failure() || cancelled()
        run: |
          echo "=== app/build/reports/tests ==="
          if [ -d app/build/reports/tests ]; then
            ls -laR app/build/reports/tests
          else
            echo "(missing)"
          fi
          echo "=== app/build/test-results ==="
          if [ -d app/build/test-results ]; then
            ls -laR app/build/test-results
          else
            echo "(missing)"
          fi
          echo "file count:"
          find app/build/reports/tests app/build/test-results -type f 2>/dev/null | wc -l

      - name: Upload unit test reports
        id: upload_unit_test_reports
        if: failure() || cancelled()
        # https://github.com/actions/upload-artifact/commit/ea165f8d65b6e75b540449e92b4886f43607fa02
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: unit-test-reports
          path: |
            app/build/reports/tests/
            app/build/test-results/
          retention-days: 7
          if-no-files-found: ignore

  release-compile-check:
    # keep in sync with build-and-test (do not edit that job)
    needs: [policy-checks, build-and-test]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: write
    env:
      GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up JDK 17
        id: setup_java
        # https://github.com/actions/setup-java/commit/c5195efecf7bdfc987ee8bae7a71cb8b11521c00
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        id: setup_android
        # https://github.com/android-actions/setup-android/commit/9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
        with:
          packages: tools platform-tools

      # must match build-and-test ensure_android_packages: platforms;android-36 + build-tools;35.0.0
      - name: Ensure Android platform 36 and build-tools
        id: ensure_android_packages
        run: |
          set -euo pipefail
          if [ -z "${ANDROID_SDK_ROOT:-}" ] && [ -n "${ANDROID_HOME:-}" ]; then
            ANDROID_SDK_ROOT="$ANDROID_HOME"
          fi
          : "${ANDROID_SDK_ROOT:?ANDROID_SDK_ROOT/ANDROID_HOME not set}"
          : "${ANDROID_HOME:=$ANDROID_SDK_ROOT}"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          if [ ! -d "$ANDROID_SDK_ROOT" ] || [ ! -w "$ANDROID_SDK_ROOT" ]; then
            echo "ANDROID_SDK_ROOT is missing or not writable: $ANDROID_SDK_ROOT" >&2
            exit 1
          fi

          SDKMANAGER=""
          if [ -x "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          else
            for candidate in "$ANDROID_SDK_ROOT"/cmdline-tools/*/bin/sdkmanager; do
              if [ -x "$candidate" ]; then
                SDKMANAGER="$candidate"
                break
              fi
            done
          fi
          if [ -z "$SDKMANAGER" ] && [ -x "$ANDROID_SDK_ROOT/tools/bin/sdkmanager" ]; then
            SDKMANAGER="$ANDROID_SDK_ROOT/tools/bin/sdkmanager"
          fi
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager not found under ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >&2
            exit 1
          fi

          if [ ! -d "$ANDROID_SDK_ROOT/platforms/android-36" ]; then
            echo "Installing platforms;android-36"
            "$SDKMANAGER" --sdk_root="$ANDROID_SDK_ROOT" "platforms;android-36"
          else
            echo "platforms;android-36 already present"
          fi
          if [ ! -d "$ANDROID_SDK_ROOT/build-tools/35.0.0" ]; then
            echo "Installing build-tools;35.0.0"
            "$SDKMANAGER" --sdk_root="$ANDROID_SDK_ROOT" "build-tools;35.0.0"
          else
            echo "build-tools;35.0.0 already present"
          fi

      - name: Set up Gradle
        id: setup_gradle
        # https://github.com/gradle/actions/commit/06832c7b30a0129d7fb559bcc6e43d26f6374244
        uses: gradle/actions/setup-gradle@06832c7b30a0129d7fb559bcc6e43d26f6374244 # v4.3.1
        with:
          cache-read-only: true

      - name: Make gradlew executable
        id: chmod_gradlew
        run: chmod +x gradlew

      # Release URL is validated when compile tasks generate BuildConfig; do not add a second gradlew / verifyBackendBaseUrlContract here.
      - name: Compile google/huawei release Kotlin
        id: compile_release_kotlin
        run: ./gradlew :app:compileGoogleReleaseKotlin :app:compileHuaweiReleaseKotlin -PbackendBaseUrl=https://ci-placeholder.example.com --stacktrace

      - name: Upload release compile reports
        id: upload_release_compile_reports
        if: failure() || cancelled()
        # https://github.com/actions/upload-artifact/commit/ea165f8d65b6e75b540449e92b4886f43607fa02
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-compile-reports
          path: |
            app/build/reports/
          retention-days: 7
          if-no-files-found: warn

  backend-php-tests:
    # needs policy-checks only so this job runs in parallel with build-and-test.
    # No setup-php/composer: GitHub-hosted runner PHP CLI + openssl extension only.
    # YAML step order is not execution order; always()+checkout.outcome gates keep both suites runnable after a sibling fail.
    # Phase 4 branch protection should require this job as a status check; do not add PHP to release-compile-check needs.
    needs: policy-checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Verify PHP CLI and openssl
        id: verify_php_cli
        if: always() && steps.checkout.outcome == 'success'
        timeout-minutes: 1
        run: |
          set -euo pipefail
          command -v php
          php -v
          if ! php -r 'exit((PHP_VERSION_ID >= 80200 && PHP_VERSION_ID < 80500) ? 0 : 1);'; then
            echo "PHP version must be 8.2 inclusive .. below 8.5 (PHP_VERSION_ID 80200..80499)." >&2
            php -r 'echo PHP_VERSION, PHP_EOL;'
            exit 1
          fi
          php -r 'exit(extension_loaded("openssl") ? 0 : 1);'
          test -f "${GITHUB_WORKSPACE}/backend/GoogleCertsVerifierTest.php"
          test -f "${GITHUB_WORKSPACE}/backend/EntitlementControllerTest.php"

      # verify fail → skip suites; sibling suites always-run after verify ok.
      - name: GoogleCertsVerifierTest
        id: google_certs_verifier_test
        if: always() && steps.checkout.outcome == 'success' && steps.verify_php_cli.outcome == 'success'
        timeout-minutes: 2
        # E_ALL surfaces warnings; allow_url_fopen=0 is no-network contract.
        run: php -d allow_url_fopen=0 -d display_errors=1 -d error_reporting=E_ALL "${GITHUB_WORKSPACE}/backend/GoogleCertsVerifierTest.php"

      - name: EntitlementControllerTest
        id: entitlement_controller_test
        if: always() && steps.checkout.outcome == 'success' && steps.verify_php_cli.outcome == 'success'
        timeout-minutes: 2
        # E_ALL surfaces warnings; allow_url_fopen=0 is no-network contract.
        run: php -d allow_url_fopen=0 -d display_errors=1 -d error_reporting=E_ALL "${GITHUB_WORKSPACE}/backend/EntitlementControllerTest.php"

      - name: Aggregate backend-php-test results
        if: ${{ !cancelled() && always() && steps.checkout.outcome == 'success' }}
        run: |
          set -euo pipefail
          verify='${{ steps.verify_php_cli.outcome }}'
          certs='${{ steps.google_certs_verifier_test.outcome }}'
          entitlement='${{ steps.entitlement_controller_test.outcome }}'
          echo "verify_php_cli: $verify"
          echo "google_certs_verifier_test: $certs"
          echo "entitlement_controller_test: $entitlement"
          if [ "$verify" != success ] || [ "$certs" != success ] || [ "$entitlement" != success ]; then
            echo "One or more backend-php-test steps were not success."
            exit 1
          fi

